version: '3.8'

services:
  api:
    build: .
    container_name: energy_forecast_api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    command: python main.py api --host 0.0.0.0 --port 8000
    networks:
      - energy_forecast_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build: .
    container_name: energy_forecast_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - energy_forecast_network
    depends_on:
      - api

networks:
  energy_forecast_network:
    driver: bridge
